<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base SEO (overridden per-page by react-helmet-async) -->
    <title>Harun | Microsoft Fabric Analytics Engineer & Power BI Design Specialist</title>
    <meta name="description" content="Harun — Microsoft Fabric Analytics Engineer & Power BI Design Specialist. I build end-to-end analytics solutions on Fabric Lakehouse, Direct Lake semantic models, and executive-grade Power BI dashboards that drive decisions." />

    <!-- TikTok domain verification -->
    <meta name="tiktok-developers-site-verification" content="C3l2QWdPijjB6KAJDs24sNTq0jIGCfIz" />
    <meta name="tiktok-developers-site-verification" content="vn02qWwXkAGwoa6evyZJAvU1e9yHGrDo" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://harunrhimu.github.io/" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harun | Microsoft Fabric & Power BI" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://harunrhimu.github.io/og-image.jpg" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Additional SEO -->
    <meta name="author" content="Md Harun Or Roshid" />
    <meta name="robots" content="index,follow" />
    <meta name="googlebot" content="index,follow" />
    <meta name="theme-color" content="#f8f7f4" />

    <!-- THEME_BOOT — must run before first paint or the page flashes the
         wrong palette. Mirrors DEFAULT_THEME in src/utils/theme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('harun-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', theme === 'dark' ? '#080d1a' : '#f8f7f4');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta name="keywords" content="Microsoft Fabric Analytics Engineer, Fabric Lakehouse architecture, Power BI semantic model optimization, DAX time intelligence, Direct Lake mode, Medallion architecture Power BI, Power BI Design Specialist, Power BI Dashboard Development, Microsoft Fabric DP-600, Microsoft Fabric DP-700, Fabric Data Engineer" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
