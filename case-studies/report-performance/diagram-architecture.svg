<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="620" fill="#F4F5F7"/>

  <text x="24" y="34" font-size="21" font-weight="700" fill="#205072">The medallion pipeline</text>
  <text x="24" y="58" font-size="13" fill="#5C6670">The cost did not disappear — it moved from once per interaction to once per refresh. Only the middle two layers were rewritten.</text>

  <!-- arrows -->
  <g fill="#329D9C">
    <path d="M280 268 L306 280 L280 292 Z"/>
    <path d="M576 268 L602 280 L576 292 Z"/>
    <path d="M872 268 L898 280 L872 292 Z"/>
  </g>

  <!-- ============ COLUMN 1 : SOURCE ============ -->
  <rect x="24" y="86" width="252" height="384" rx="15" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1"/>
  <path d="M24 101 a15 15 0 0 1 15 -15 h222 a15 15 0 0 1 15 15 v29 h-252 Z" fill="#205072"/>
  <text x="40" y="112" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">1 &#183; SOURCE</text>
  <text x="40" y="126" font-size="11" fill="#CFF4D2">ERP extract &#183; one flat table</text>

  <g font-size="12" fill="#252423">
    <text x="40" y="158" font-weight="600">PurchaseOrderLine</text>
    <text x="40" y="175" font-size="11" fill="#5C6670">One row per purchase-order line</text>
    <text x="40" y="194" font-size="11" fill="#5C6670">40-plus columns, widest on the</text>
    <text x="40" y="209" font-size="11" fill="#5C6670">fact row itself</text>
    <text x="40" y="233" font-size="11" fill="#5C6670">Vendor, item, warehouse and</text>
    <text x="40" y="248" font-size="11" fill="#5C6670">status all flattened onto it</text>
  </g>

  <rect x="40" y="272" width="220" height="1" fill="#E4E8EB"/>
  <text x="40" y="296" font-size="11" font-weight="700" fill="#D64550">Queried directly</text>
  <text x="40" y="314" font-size="11" fill="#5C6670">The report read this table as</text>
  <text x="40" y="329" font-size="11" fill="#5C6670">its model. Every open and every</text>
  <text x="40" y="344" font-size="11" fill="#5C6670">filter paid the full scan and join.</text>

  <!-- ============ COLUMN 2 : BRONZE ============ -->
  <rect x="320" y="86" width="252" height="384" rx="15" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1"/>
  <path d="M320 101 a15 15 0 0 1 15 -15 h222 a15 15 0 0 1 15 15 v29 h-252 Z" fill="#2A7C8C"/>
  <text x="336" y="112" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">2 &#183; BRONZE</text>
  <text x="336" y="126" font-size="11" fill="#CFF4D2">Raw copy &#183; unmodified</text>

  <g font-size="12" fill="#252423">
    <text x="336" y="158" font-weight="600">The extract, as it landed</text>
    <text x="336" y="175" font-size="11" fill="#5C6670">No transformation, no cleaning,</text>
    <text x="336" y="190" font-size="11" fill="#5C6670">no assumed types.</text>
  </g>

  <rect x="336" y="212" width="220" height="1" fill="#E4E8EB"/>
  <text x="336" y="236" font-size="11" font-weight="700" fill="#205072">Why keep it at all</text>
  <text x="336" y="254" font-size="11" fill="#5C6670">Provenance, and a starting point</text>
  <text x="336" y="269" font-size="11" fill="#5C6670">the rest of the pipeline can</text>
  <text x="336" y="284" font-size="11" fill="#5C6670">always be re-run from. Bronze is</text>
  <text x="336" y="299" font-size="11" fill="#5C6670">never edited, so it stays honest.</text>

  <rect x="336" y="322" width="220" height="1" fill="#E4E8EB"/>
  <text x="336" y="346" font-size="11" font-weight="700" fill="#205072">Unchanged shape</text>
  <text x="336" y="364" font-size="11" fill="#5C6670">Still wide and still denormalized</text>
  <text x="336" y="379" font-size="11" fill="#5C6670">— deliberately. Reducing data here</text>
  <text x="336" y="394" font-size="11" fill="#5C6670">would blur what the source was.</text>

  <!-- ============ COLUMN 3 : SILVER ============ -->
  <rect x="616" y="86" width="252" height="384" rx="15" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1"/>
  <path d="M616 101 a15 15 0 0 1 15 -15 h222 a15 15 0 0 1 15 15 v29 h-252 Z" fill="#329D9C"/>
  <text x="632" y="112" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">3 &#183; SILVER</text>
  <text x="632" y="126" font-size="11" fill="#CFF4D2">SQL &#183; where this phase worked</text>

  <g font-size="12" fill="#252423">
    <text x="632" y="158" font-weight="600">Filter before joining</text>
    <text x="632" y="175" font-size="11" fill="#5C6670">Predicates move ahead of every</text>
    <text x="632" y="190" font-size="11" fill="#5C6670">join, so each step reads less.</text>

    <text x="632" y="214" font-weight="600">Project the used columns</text>
    <text x="632" y="231" font-size="11" fill="#5C6670">About twenty columns kept of</text>
    <text x="632" y="246" font-size="11" fill="#5C6670">the forty-plus that were read.</text>

    <text x="632" y="270" font-weight="600">Pre-aggregate the detail</text>
    <text x="632" y="287" font-size="11" fill="#5C6670">Receiving and tax lines collapse</text>
    <text x="632" y="302" font-size="11" fill="#5C6670">to one row per line before any</text>
    <text x="632" y="317" font-size="11" fill="#5C6670">join touches them.</text>

    <text x="632" y="341" font-weight="600">Split the hidden inner join</text>
    <text x="632" y="358" font-size="11" fill="#5C6670">A left join with a WHERE on its</text>
    <text x="632" y="373" font-size="11" fill="#5C6670">columns becomes explicit, so the</text>
    <text x="632" y="388" font-size="11" fill="#5C6670">engine can push the filter down.</text>
  </g>

  <rect x="632" y="410" width="220" height="1" fill="#E4E8EB"/>
  <text x="632" y="434" font-size="11" font-weight="700" fill="#205072">Output</text>
  <text x="632" y="452" font-size="11" fill="#5C6670">Reduced, typed, one-to-one sets.</text>

  <!-- ============ COLUMN 4 : GOLD ============ -->
  <rect x="912" y="86" width="252" height="384" rx="15" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1"/>
  <path d="M912 101 a15 15 0 0 1 15 -15 h222 a15 15 0 0 1 15 15 v29 h-252 Z" fill="#56C596"/>
  <text x="928" y="112" font-size="12" font-weight="700" fill="#0E3B33" letter-spacing="1.2">4 &#183; GOLD</text>
  <text x="928" y="126" font-size="11" fill="#14453C">SQL &#183; fact + dimensions</text>

  <g font-size="12" fill="#252423">
    <text x="928" y="158" font-weight="600">Fact_PurchaseOrderLine</text>
    <text x="928" y="175" font-size="11" fill="#5C6670">The grain the report counts at.</text>

    <text x="928" y="205" font-weight="600">Dim_Vendor &#183; Dim_Item</text>
    <text x="928" y="222" font-weight="600">Dim_Warehouse &#183; Dim_Date</text>
    <text x="928" y="239" font-size="11" fill="#5C6670">The attributes that used to sit</text>
    <text x="928" y="254" font-size="11" fill="#5C6670">flattened on every fact row.</text>
  </g>

  <rect x="928" y="278" width="220" height="1" fill="#E4E8EB"/>
  <text x="928" y="302" font-size="11" font-weight="700" fill="#205072">The report reads this</text>
  <text x="928" y="320" font-size="11" fill="#5C6670">Same pages, same visuals, same</text>
  <text x="928" y="335" font-size="11" fill="#5C6670">slicers — the model and the</text>
  <text x="928" y="350" font-size="11" fill="#5C6670">semantic layer sit on top of Gold</text>
  <text x="928" y="365" font-size="11" fill="#5C6670">exactly as they did before.</text>

  <rect x="928" y="388" width="220" height="1" fill="#E4E8EB"/>
  <text x="928" y="412" font-size="11" font-weight="700" fill="#205072">Pre-shaped, not pre-computed</text>
  <text x="928" y="430" font-size="11" fill="#5C6670">Gold holds rows, not answers — so</text>
  <text x="928" y="445" font-size="11" fill="#5C6670">any slicer combination still works.</text>

  <!-- ============ COST BAND ============ -->
  <rect x="24" y="486" width="1152" height="60" rx="12" fill="#FFFFFF" stroke="#D9DEE3" stroke-width="1"/>
  <text x="48" y="512" font-size="12" font-weight="700" fill="#D64550">BEFORE</text>
  <text x="48" y="531" font-size="11" fill="#5C6670">Scan and join ran once per interaction — once per open, once per filter, once per user.</text>
  <text x="624" y="512" font-size="12" font-weight="700" fill="#00873A">AFTER</text>
  <text x="624" y="531" font-size="11" fill="#5C6670">The same reducing work runs once per refresh; the report then reads a small table many times.</text>

  <text x="24" y="580" font-size="11" fill="#5C6670">Bronze and Gold are new tables; the Silver rewrites are the actual subject of this phase. Row counts and timings are in the sections that follow.</text>
  <text x="24" y="600" font-size="11" fill="#5C6670">No measure, relationship or visual was edited to produce any figure in this write-up.</text>
</svg>
