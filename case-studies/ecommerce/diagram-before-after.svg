<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 665" width="1200" height="665" role="img" aria-label="Before and after comparison of the data model across eight structural metrics">
  <rect width="1200" height="665" rx="18" fill="#F5F1EB"/>
  <g font-family="Segoe UI,Helvetica Neue,Arial,sans-serif">
    <text x="40" y="48" font-size="25" font-weight="700" fill="#202020">Before / after — what the rebuild actually changed</text>
    <text x="40" y="76" font-size="13.5" fill="#8A8D93">Eight structural metrics. Nothing was deleted to get here — the same 99,441 orders survive the conversion.</text>

    <!-- column headers -->
    <rect x="650" y="103" width="220" height="36" rx="10" fill="#E76F51"/>
    <text x="760" y="127" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">BEFORE</text>
    <rect x="925" y="103" width="220" height="36" rx="10" fill="#F4A261"/>
    <text x="1035" y="127" font-size="13" font-weight="700" fill="#202020" text-anchor="middle" letter-spacing="1.2">AFTER</text>

    <!-- row 1 -->
    <rect x="40" y="158" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="168" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="185" font-size="13.5" font-weight="700" fill="#202020">Schema pattern</text>
    <rect x="650" y="165" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="185" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">hybrid + snowflake</text>
    <text x="897" y="185" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="165" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="185" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">pure star</text>

    <!-- row 2 -->
    <rect x="40" y="208" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="218" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="235" font-size="13.5" font-weight="700" fill="#202020">Fact tables</text>
    <rect x="650" y="215" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="235" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">4</text>
    <text x="897" y="235" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="215" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="235" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">1</text>

    <!-- row 3 -->
    <rect x="40" y="258" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="268" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="285" font-size="13.5" font-weight="700" fill="#202020">Fact-to-fact joins</text>
    <text x="220" y="285" font-size="11.5" fill="#8A8D93">the reason totals disagreed</text>
    <rect x="650" y="265" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="285" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">3</text>
    <text x="897" y="285" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="265" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="285" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">0</text>

    <!-- row 4 -->
    <rect x="40" y="308" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="318" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="335" font-size="13.5" font-weight="700" fill="#202020">Date tables</text>
    <text x="220" y="335" font-size="11.5" fill="#8A8D93">time intelligence needs exactly one</text>
    <rect x="650" y="315" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="335" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">8 auto-generated</text>
    <text x="897" y="335" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="315" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="335" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">1 conformed</text>

    <!-- row 5 -->
    <rect x="40" y="358" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="368" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="385" font-size="13.5" font-weight="700" fill="#202020">Bidirectional filters</text>
    <text x="220" y="385" font-size="11.5" fill="#8A8D93">ambiguous filter paths</text>
    <rect x="650" y="365" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="385" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">1</text>
    <text x="897" y="385" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="365" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="385" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">0</text>

    <!-- row 6 -->
    <rect x="40" y="408" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="418" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="435" font-size="13.5" font-weight="700" fill="#202020">Snowflake hops</text>
    <rect x="650" y="415" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="435" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">1</text>
    <text x="897" y="435" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="415" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="435" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">0</text>

    <!-- row 7 -->
    <rect x="40" y="458" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="468" width="4" height="24" rx="2" fill="#F4A261"/>
    <text x="64" y="485" font-size="13.5" font-weight="700" fill="#202020">Orphan tables</text>
    <rect x="650" y="465" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="485" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">1</text>
    <text x="897" y="485" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="465" width="220" height="30" rx="8" fill="#F4A261"/>
    <text x="1035" y="485" font-size="12.5" font-weight="700" fill="#202020" text-anchor="middle">0</text>

    <!-- row 8 -->
    <rect x="40" y="508" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#E8E1D6"/>
    <rect x="40" y="518" width="4" height="24" rx="2" fill="#2B2B2B"/>
    <text x="64" y="535" font-size="13.5" font-weight="700" fill="#202020">Orders preserved</text>
    <text x="220" y="535" font-size="11.5" fill="#8A8D93">including 775 that never shipped an item</text>
    <rect x="650" y="515" width="220" height="30" rx="8" fill="#FBE9E3"/>
    <text x="760" y="535" font-size="12.5" font-weight="700" fill="#A63D24" text-anchor="middle">at risk from inner joins</text>
    <text x="897" y="535" font-size="13" fill="#8A8D93" text-anchor="middle">→</text>
    <rect x="925" y="515" width="220" height="30" rx="8" fill="#2B2B2B"/>
    <text x="1035" y="535" font-size="12.5" font-weight="700" fill="#F4A261" text-anchor="middle">all 99,441</text>

    <!-- footer -->
    <rect x="40" y="578" width="1120" height="54" rx="12" fill="#2B2B2B"/>
    <text x="600" y="611" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Same data. Same 99,441 orders. One unambiguous answer per question.</text>
  </g>
</svg>
